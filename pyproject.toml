[project]
name = "enterprise-rag"
version = "0.2.0"
description = "Enterprise multi-source knowledge base RAG + NL2SQL Q&A system"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "openai>=1.50.0",
    "qdrant-client>=1.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.12",
    "markdown>=3.7",
    "PyMuPDF>=1.25.0",
    "Pillow>=10.0.0",
    "easyocr>=1.7.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.0.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40.0"]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "httpx>=0.28.0"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
